[package]
name = "matma-indexer"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "MATMA static source indexing, mirrored scaffolding, and read-only impact selection for Rust"
license = "MIT"
repository = "https://github.com/rzepeda/matma-rust"

[lib]
name = "matma"
path = "src/lib.rs"

[[bin]]
name = "matma-indexer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
heck = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
