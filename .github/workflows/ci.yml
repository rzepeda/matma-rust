name: MATMA Rust CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: cargo test (${{ matrix.os }})
    # Windows and all PRs remain GitHub-hosted.
    runs-on: ${{ fromJSON(matrix.os == 'ubuntu-latest' && github.event_name != 'pull_request' && '["self-hosted","linux","x64","homeserver-ci-safe"]' || format('["{0}"]', matrix.os)) }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all
      - run: cargo check --all-targets
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo build --bin matma-indexer
      - name: Consumer acceptance — native private mirrors, real pairs and stateful mocks
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=../../target/debug/matma-indexer.exe; else EXE=../../target/debug/matma-indexer; fi
          cd fixtures/consumer
          "$EXE" scaffold --target A --format json
          "$EXE" scaffold --target B --format json
          "$EXE" scaffold --target PricingContract --format json
          "$EXE" scaffold --target AltProcessor --format json
          "$EXE" validate --check --format json
          "$EXE" impact --target A --level 1 --format json
          cargo test --all-targets
          cargo test --lib order_processing::matma_unit_a
          cargo test --lib order_processing::matma_interaction_a
          cargo test --lib order_processing::matma_unit_pricing_contract
          python verify_changes.py
